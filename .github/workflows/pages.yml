name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Runtime files only (no QA screenshots or briefs), plus the Neon config that switches the page to the Data API.
      - name: Assemble the site
        run: |
          src=scrollcraft/builds/creative-episode
          mkdir _site
          cp -r "$src/index.html" "$src/scrollcraft.css" "$src/scrollcraft.js" "$src/ce-store.js" "$src/assets" "$src/fonts" _site/
          cp pages/ce-config.js _site/ce-config.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
